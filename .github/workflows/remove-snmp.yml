name: Remove SNMP from PHP 5.6 hosting builder

on:
  push:
    paths:
      - .github/workflows/remove-snmp.yml
      - .github/remove-snmp.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch builder
        run: |
          python3 .github/remove-snmp.py
          bash -n build-php56.sh
          git diff --check
          git diff -- build-php56.sh
      - name: Commit
        run: |
          git config user.name "ngm-php-maintenance"
          git config user.email "ngm-php-maintenance@users.noreply.github.com"
          git add build-php56.sh
          test "$(git diff --cached --name-only)" = "build-php56.sh"
          git commit -m "Drop SNMP from shared hosting runtime"
          git push origin HEAD:main
