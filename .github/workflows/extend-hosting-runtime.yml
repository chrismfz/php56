name: Extend PHP 5.6 hosting runtime

on:
  push:
    paths:
      - .github/workflows/extend-hosting-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch builder
        run: |
          python3 .github/extend-hosting-runtime.py
          bash -n build-php56.sh
          git diff --check
          test "$(git diff --name-only)" = "build-php56.sh"
      - name: Commit
        run: |
          git config user.name "ngm-php-maintenance"
          git config user.email "ngm-php-maintenance@users.noreply.github.com"
          git add build-php56.sh
          git commit -m "Add hosting extensions and ionCube provisioning"
          git push origin HEAD:main
