name: Fix OpenSSL Perl build environment

on:
  push:
    paths:
      - '.github/workflows/fix-openssl-perl.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch build-php56.sh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-php56.sh')
          s = p.read_text()
          old = '''  pushd "${BUILD_ROOT}/openssl-${OPENSSL_VERSION}" >/dev/null
    log "building OpenSSL ${OPENSSL_VERSION} -> ${OPENSSL_PREFIX}"
    ./config \\
      --prefix="${OPENSSL_PREFIX}" \\
      --openssldir="${OPENSSL_PREFIX}" \\
      shared zlib -fPIC
    make -j"$JOBS"
    make install_sw
  popd >/dev/null
'''
          new = '''  pushd "${BUILD_ROOT}/openssl-${OPENSSL_VERSION}" >/dev/null
    local openssl_perl5lib
    openssl_perl5lib="${PWD}/util/perl:${PWD}/external/perl/Text-Template-1.56/lib"
    [ -r "${PWD}/util/perl/OpenSSL/fallback.pm" ] || die "OpenSSL bundled Perl fallback module is missing."
    [ -r "${PWD}/external/perl/Text-Template-1.56/lib/Text/Template.pm" ] || die "OpenSSL bundled Text::Template module is missing."

    log "building OpenSSL ${OPENSSL_VERSION} -> ${OPENSSL_PREFIX}"
    env -u PERL5OPT PERL5LIB="$openssl_perl5lib" ./config \\
      --prefix="${OPENSSL_PREFIX}" \\
      --openssldir="${OPENSSL_PREFIX}" \\
      shared zlib -fPIC
    env -u PERL5OPT PERL5LIB="$openssl_perl5lib" make -j"$JOBS"
    env -u PERL5OPT PERL5LIB="$openssl_perl5lib" make install_sw
  popd >/dev/null
'''
          if old not in s:
              raise SystemExit('target OpenSSL build block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          bash -n build-php56.sh
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "Chris"
          git config user.email "chrismfz@gmail.com"
          git add build-php56.sh
          git commit -m "Isolate OpenSSL Perl build environment"
          git push origin main
