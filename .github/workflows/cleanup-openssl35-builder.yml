name: Cleanup OpenSSL 3.5 development builder

on:
  push:
    paths:
      - .github/workflows/cleanup-openssl35-builder.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove build-time PHP source rewrite
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('build-openssl35-dev.sh'); t=p.read_text(); a=t.index('  # OpenSSL 3 removed RSA_SSLV23_PADDING.'); b=t.index('PY\\n}', a); p.write_text(t[:a] + t[b+3:])"
          grep -Fq 'SRC_DIR/ext/openssl/openssl.c' build-openssl35-dev.sh && exit 1 || true
          git diff --check
          test "$(git diff --name-only)" = "build-openssl35-dev.sh"
      - name: Commit builder cleanup
        shell: bash
        run: |
          git config user.name "ngm-php-maintenance"
          git config user.email "ngm-php-maintenance@users.noreply.github.com"
          git add build-openssl35-dev.sh
          git commit -m "Build OpenSSL 3.5 probe from tracked PHP source"
          git push origin HEAD:main
