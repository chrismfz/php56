name: Materialize OpenSSL 3.5 source fix

on:
  push:
    paths:
      - .github/workflows/materialize-openssl35-source.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch tracked PHP source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ext/openssl/openssl.c')
          text = path.read_text(encoding='utf-8')
          old = '\tREGISTER_LONG_CONSTANT("OPENSSL_SSLV23_PADDING", RSA_SSLV23_PADDING, CONST_CS|CONST_PERSISTENT);'
          new = '#ifdef RSA_SSLV23_PADDING\n' + old + '\n#endif'

          if new not in text:
              count = text.count(old)
              if count != 1:
                  raise SystemExit('expected exactly one RSA_SSLV23_PADDING registration, found %d' % count)
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff --exit-code --quiet && { echo 'No source changes produced'; exit 1; }
          test "$(git diff --name-only)" = "ext/openssl/openssl.c"
          git diff -- ext/openssl/openssl.c

      - name: Commit source port
        shell: bash
        run: |
          git config user.name "ngm-php-maintenance"
          git config user.email "ngm-php-maintenance@users.noreply.github.com"
          git add ext/openssl/openssl.c
          git commit -m "Port PHP 5.6 OpenSSL source to OpenSSL 3.5"
          git push origin HEAD:main
